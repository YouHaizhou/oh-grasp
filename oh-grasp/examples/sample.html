<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sample.js — structure</title>
<style>
  :root { --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --text:#1a202c; --muted:#5b6472; --faint:#9aa3b2; --border:#e5e7eb; --border-strong:#cbd5e1;
    --accent:#6366f1; --accent-deep:#4338ca; --chip-bg:#f1f5f9; --chip-border:#e2e8f0; --canvas:#f8fafc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); background: #ffffff; color: var(--text); padding-bottom: 90px; }

  .switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    background: #10151c; color: #e6edf3; border: 1px solid #2a3548;
    padding: 8px 12px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
    z-index: 999; font-size: 13px;
  }
  .switcher button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #2a3548; background: #1a2230; color: #e6edf3; cursor: pointer; font-size: 15px; line-height: 1; }
  .switcher button:hover { background: #24304a; }
  .switcher .sw-tag { font-size: 10px; letter-spacing: .08em; color: #8b98a9; text-transform: uppercase; }

  /* ===== A · Flow ===== */
  .vA { max-width: 1060px; margin: 0 auto; padding: 40px 28px; }
  .vA-head { margin-bottom: 24px; }
  .vA-title { font-family: var(--mono); font-size: 26px; font-weight: 700; margin: 0 0 6px; }
  .vA-sub { font-size: 15px; color: var(--muted); margin: 0 0 18px; }
  .vA-io { display: flex; flex-wrap: wrap; gap: 10px; }
  .vA-io .group { display: flex; align-items: center; gap: 8px; }
  .vA-io .cap { font-size: 12px; color: var(--faint); letter-spacing: .04em; }
  .vA-io .chip { font-family: var(--mono); font-size: 12px; background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--text); padding: 4px 10px; border-radius: 999px; }
  .vA-body { display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: start; }
  .vA-sec { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 14px; }
  .vA-extcard { background: var(--canvas); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .vA-extname { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--text); }
  .vA-extdesc { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
  .vA-extuse { font-size: 12px; color: var(--accent-deep); font-family: var(--mono); }
  .vA-hint { font-size: 12px; color: var(--faint); margin-bottom: 10px; }
  .vA-flow { background: var(--canvas); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative; height: 580px; cursor: grab; user-select: none; }
  .vA-flow.dragging { cursor: grabbing; }
  .vA-zoom { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .vA-src { font-family: var(--mono); font-size: 12px; line-height: 1.5; background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0 0 16px; white-space: pre; }
  .vA-zoom-badge { position: absolute; top: 10px; right: 12px; font-size: 11px; color: var(--faint); background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
  .node { cursor: pointer; }
  .node rect { transition: stroke .1s, fill .1s; }
  .node:hover rect { stroke: var(--accent); }
  .node.sel rect { stroke: var(--accent); stroke-width: 1.5; fill: #eef2ff; }
  .vA-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: none; align-items: center; justify-content: center; z-index: 60; padding: 24px; }
  .vA-overlay.open { display: flex; }
  .vA-modal { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 60px rgba(15,23,42,.25); padding: 22px 24px; width: min(620px, 100%); max-height: 82vh; overflow-y: auto; }
  .vA-detail-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .vA-detail-name { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .vA-detail-kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .vA-detail-close { margin-left: auto; border: none; background: none; color: var(--faint); font-size: 22px; cursor: pointer; line-height: 1; }
  .vA-detail-desc { font-size: 14px; line-height: 1.7; color: var(--muted); margin: 0 0 16px; }
  .vA-modal h4 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .vA-empty { color: var(--faint); font-size: 13px; }

  /* ===== B · Index ===== */
  .vB { max-width: 960px; margin: 0 auto; padding: 48px 32px; }
  .vB-head { border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 32px; }
  .vB-title { font-family: var(--mono); font-size: 28px; font-weight: 700; margin: 0 0 8px; }
  .vB-sub { font-size: 16px; color: var(--muted); margin: 0 0 20px; }
  .vB-io { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .vB-io dt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .vB-io dd { margin: 0; font-size: 14px; color: var(--text); }
  .vB h2 { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 16px; }
  .vB h2 span { color: var(--faint); font-weight: 400; }
  .vB-ext { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 40px; }
  .vB-extcard { border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .vB-extname { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .vB-extdesc { font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
  .vB-extuse { font-size: 12px; color: var(--accent-deep); font-family: var(--mono); }
  .vB-tbl { width: 100%; border-collapse: collapse; }
  .vB-tbl th { text-align: left; font-size: 12px; color: var(--faint); font-weight: 500; padding: 0 0 10px; border-bottom: 1px solid var(--border); }
  .vB-tbl td { padding: 14px 0; border-bottom: 1px solid #f0f2f5; vertical-align: top; font-size: 14px; }
  .vB-tbl td.m { font-family: var(--mono); font-weight: 600; }
  .vB-tbl td.d { color: var(--muted); }
  .vB-flow { font-family: var(--mono); font-size: 13px; color: var(--accent-deep); white-space: nowrap; }
</style>
</head>
<body>
<div id="root"></div>

<div class="switcher">
  <button id="prev" aria-label="上一个">←</button>
  <span class="sw-tag">oh-grasp</span>
  <span id="swlabel">A — Flow · 数据流图</span>
  <button id="next" aria-label="下一个">→</button>
</div>

<script type="application/json" id="oh-grasp-ir">{
  "meta": {
    "title": "sample.js",
    "subtitle": "读取并解析 JSON 配置，按配置处理记录并建立索引。",
    "input": [
      "config 文件路径",
      "records 数组"
    ],
    "output": [
      "处理后的记录",
      "按 id 建立的索引"
    ]
  },
  "modules": [
    {
      "id": "ext_fs",
      "label": "fs",
      "type": "external",
      "description": "读取配置文件",
      "input": [
        "readFileSync"
      ]
    },
    {
      "id": "read_config",
      "label": "readConfig",
      "type": "internal",
      "description": "读文件并交给解析",
      "detail": "读取指定路径的配置文件，用 fs.readFileSync 同步读取整个文件为 UTF-8 字符串，再原样交给 parseConfig 解析。此处不做任何校验或转换。",
      "source": "function readConfig(path) {\n  const raw = fs.readFileSync(path, 'utf8');\n  return parseConfig(raw);\n}"
    },
    {
      "id": "parse_config",
      "label": "parseConfig",
      "type": "internal",
      "description": "把原始文本解析成对象",
      "detail": "接收 readConfig 传来的原始文本，调用 JSON.parse 解析为配置对象。解析失败时异常会向上抛出，由调用方决定如何处理。",
      "source": "function parseConfig(raw) {\n  return JSON.parse(raw);\n}"
    },
    {
      "id": "process_records",
      "label": "processRecords",
      "type": "internal",
      "description": "按配置为每条记录打上 source",
      "detail": "遍历 records 数组，为每条记录展开并附加 config.source 字段，生成带来源标记的新记录，供后续按来源追踪或过滤。",
      "source": "function processRecords(records, config) {\n  return records.map(r => ({\n    ...r,\n    source: config.source,\n  }));\n}"
    },
    {
      "id": "build_index",
      "label": "buildIndex",
      "type": "internal",
      "description": "按 id 建立记录索引",
      "detail": "接收处理后的记录数组，以每条记录的 id 为键、记录本身为值，用 Object.fromEntries 构建查找索引，供按 id 快速取用。",
      "source": "function buildIndex(records) {\n  return Object.fromEntries(records.map(r => [r.id, r]));\n}"
    }
  ],
  "connections": [
    {
      "from": "read_config",
      "to": "parse_config",
      "label": "raw"
    },
    {
      "from": "parse_config",
      "to": "process_records",
      "label": "config"
    },
    {
      "from": "process_records",
      "to": "build_index",
      "label": "records"
    }
  ]
}</script>
<script>// oh-grasp 客户端 viewer。由 render.js 内联进自包含 HTML，读取嵌入的 JSON IR。
(function () {
  'use strict';
  var ir = JSON.parse(document.getElementById('oh-grasp-ir').textContent);
  var M = {};
  ir.modules.forEach(function (m) { M[m.id] = m; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function clip(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  function flowLayout() {
    var intMods = ir.modules.filter(function (m) { return m.type === 'internal'; });
    var byId = {};
    ir.modules.forEach(function (m) { byId[m.id] = m; });
    var edges = (ir.connections || []).filter(function (c) {
      return byId[c.from] && byId[c.from].type === 'internal' && byId[c.to] && byId[c.to].type === 'internal';
    });
    var adj = {}, indeg = {};
    intMods.forEach(function (m) { adj[m.id] = []; indeg[m.id] = 0; });
    edges.forEach(function (e) { adj[e.from].push(e.to); indeg[e.to]++; });
    var layer = {};
    intMods.forEach(function (m) { layer[m.id] = 0; });
    var indeg2 = {};
    Object.keys(indeg).forEach(function (k) { indeg2[k] = indeg[k]; });
    var queue = intMods.filter(function (m) { return indeg[m.id] === 0; }).map(function (m) { return m.id; });
    var order = [];
    while (queue.length) {
      var id = queue.shift();
      order.push(id);
      adj[id].forEach(function (n) {
        layer[n] = Math.max(layer[n], layer[id] + 1);
        indeg2[n]--;
        if (indeg2[n] === 0) queue.push(n);
      });
    }
    var groups = {};
    order.forEach(function (id) { (groups[layer[id]] = groups[layer[id]] || []).push(id); });
    return { groups: groups, edges: edges };
  }

  // 缩放/平移状态（仅 A 变体）。document 级监听只绑定一次，操作当前 view。
  var view = null;
  document.addEventListener('mousemove', function (e) {
    if (!view || !view.dragging) return;
    var dx = e.clientX - view.sx, dy = e.clientY - view.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) view.moved = true;
    view.tx = view.ox + dx; view.ty = view.oy + dy; view.apply();
  });
  document.addEventListener('mouseup', function () {
    if (view && view.dragging) { view.dragging = false; view.vp.classList.remove('dragging'); }
  });

  /* ============ A · Flow ============ */
  function renderA(root) {
    var io = function (arr) { return (arr || []).map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join(''); };
    var ext = ir.modules.filter(function (m) { return m.type === 'external'; });
    var head =
      '<header class="vA-head">' +
      '<h1 class="vA-title">' + esc(ir.meta.title) + '</h1>' +
      '<p class="vA-sub">' + esc(ir.meta.subtitle) + '</p>' +
      '<div class="vA-io">' +
      '<div class="group"><span class="cap">输入</span>' + io(ir.meta.input) + '</div>' +
      '<div class="group"><span class="cap">输出</span>' + io(ir.meta.output) + '</div>' +
      '</div></header>';
    var extRail =
      '<aside class="vA-ext"><div class="vA-sec">依赖 Dependencies</div>' +
      ext.map(function (m) {
        return '<div class="vA-extcard"><div class="vA-extname">' + esc(m.label) + '</div>' +
          '<div class="vA-extdesc">' + esc(m.description) + '</div>' +
          '<div class="vA-extuse">↳ ' + esc((m.input || []).join(', ')) + '</div></div>';
      }).join('') + '</aside>';

    var fl = flowLayout();
    var groups = fl.groups, edges = fl.edges;
    var CW = 220, CH = 78, PITCH = 150, TOP = 20, W = 720;
    var keys = Object.keys(groups).map(Number).sort(function (a, b) { return a - b; });
    var pos = {};
    keys.forEach(function (L) {
      var ids = groups[L];
      var total = ids.length * CW + (ids.length - 1) * 40;
      var x = (W - total) / 2;
      ids.forEach(function (id) { pos[id] = { x: x, y: TOP + L * PITCH }; x += CW + 40; });
    });
    var H = TOP + (keys.length ? Math.max.apply(null, keys) : 0) * PITCH + CH + 20;
    var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    svg += '<defs><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b6c2d1"/></marker></defs>';
    edges.forEach(function (e) {
      var a = pos[e.from], b = pos[e.to];
      if (!a || !b) return;
      var x1 = a.x + CW / 2, y1 = a.y + CH, x2 = b.x + CW / 2, y2 = b.y;
      var my = (y1 + y2) / 2;
      svg += '<path d="M' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2 + '" fill="none" stroke="#b6c2d1" stroke-width="1.5" marker-end="url(#arrA)"/>';
      svg += '<text x="' + (x1 + 12) + '" y="' + (my - 6) + '" text-anchor="start" font-size="11" fill="#64748b">' + esc(e.label) + '</text>';
    });
    keys.forEach(function (L) {
      groups[L].forEach(function (id) {
        var p = pos[id], m = M[id];
        svg += '<g class="node" data-id="' + esc(id) + '">';
        svg += '<rect x="' + p.x + '" y="' + p.y + '" width="' + CW + '" height="' + CH + '" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>';
        svg += '<circle cx="' + (p.x + CW - 16) + '" cy="' + (p.y + 16) + '" r="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="' + (p.x + CW - 16) + '" y="' + (p.y + 19) + '" font-size="10" text-anchor="middle" fill="#6366f1">i</text>';
        svg += '<text x="' + (p.x + 14) + '" y="' + (p.y + 20) + '" font-size="9" fill="#9aa3b2" letter-spacing="1.5">INTERNAL</text>';
        svg += '<text x="' + (p.x + 14) + '" y="' + (p.y + 40) + '" font-size="15" font-weight="600" fill="#1a202c" font-family="monospace">' + esc(m.label) + '</text>';
        svg += '<text x="' + (p.x + 14) + '" y="' + (p.y + 60) + '" font-size="12" fill="#5b6472">' + esc(clip(m.description, 26)) + '</text>';
        svg += '</g>';
      });
    });
    svg += '</svg>';

    root.innerHTML = '<div class="vA">' + head + '<div class="vA-body">' + extRail + '<main class="vA-main">' +
      '<div class="vA-hint">点击模块查看详情 · 滚轮缩放（光标为锚点）· 拖拽平移 · 双击复位</div>' +
      '<div class="vA-flow" id="flowViewport"><div class="vA-zoom" id="zoomTarget">' + svg + '</div><div class="vA-zoom-badge" id="zoomBadge">100%</div></div>' +
      '</main></div><div class="vA-overlay" id="detailOverlay"></div></div>';

    var detail = root.querySelector('#detailOverlay');
    function closeDetail() {
      detail.classList.remove('open');
      root.querySelectorAll('.node').forEach(function (g) { g.classList.remove('sel'); });
    }
    function openDetail(id) {
      var m = M[id];
      detail.innerHTML =
        '<div class="vA-modal">' +
        '<div class="vA-detail-head"><span class="vA-detail-name">' + esc(m.label) + '</span><span class="vA-detail-kind">internal</span><button class="vA-detail-close" id="detailClose">×</button></div>' +
        '<p class="vA-detail-desc">' + esc(m.detail || m.description) + '</p>' +
        (m.source ? '<h4>源码 Source</h4><pre class="vA-src"><code>' + esc(m.source) + '</code></pre>' : '') +
        '</div>';
      detail.classList.add('open');
      root.querySelectorAll('.node').forEach(function (g) { g.classList.toggle('sel', g.dataset.id === id); });
      root.querySelector('#detailClose').addEventListener('click', closeDetail);
    }
    detail.addEventListener('click', function (e) { if (e.target === detail) closeDetail(); });
    root.querySelectorAll('.node').forEach(function (g) {
      g.addEventListener('click', function () { if (view && view.moved) { view.moved = false; return; } openDetail(g.dataset.id); });
    });

    var vp = root.querySelector('#flowViewport'), zt = root.querySelector('#zoomTarget'), zb = root.querySelector('#zoomBadge');
    view = { vp: vp, scale: 1, tx: 0, ty: 0, moved: false, dragging: false, sx: 0, sy: 0, ox: 0, oy: 0 };
    view.apply = function () {
      zt.style.transform = 'translate(' + view.tx + 'px,' + view.ty + 'px) scale(' + view.scale + ')';
      zb.textContent = Math.round(view.scale * 100) + '%';
    };
    vp.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = vp.getBoundingClientRect();
      var mx = e.clientX - r.left, my = e.clientY - r.top;
      var ns = Math.min(3, Math.max(0.4, view.scale * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
      view.tx = mx - (mx - view.tx) * (ns / view.scale);
      view.ty = my - (my - view.ty) * (ns / view.scale);
      view.scale = ns;
      view.apply();
    }, { passive: false });
    vp.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      view.dragging = true; view.moved = false; vp.classList.add('dragging');
      view.sx = e.clientX; view.sy = e.clientY; view.ox = view.tx; view.oy = view.ty;
      e.preventDefault();
    });
    vp.addEventListener('dblclick', function () { view.scale = 1; view.tx = 0; view.ty = 0; view.apply(); });
  }

  /* ============ B · Index ============ */
  function renderB(root) {
    var ext = ir.modules.filter(function (m) { return m.type === 'external'; });
    var intl = ir.modules.filter(function (m) { return m.type === 'internal'; });
    var ioIn = (ir.meta.input || []).join(' · ') || '—';
    var ioOut = (ir.meta.output || []).join(' · ') || '—';
    var extCards = ext.map(function (m) {
      return '<div class="vB-extcard"><div class="vB-extname">' + esc(m.label) + '</div>' +
        '<div class="vB-extdesc">' + esc(m.description) + '</div>' +
        '<div class="vB-extuse">↳ ' + esc((m.input || []).join(', ')) + '</div></div>';
    }).join('');
    function flowText(m) {
      var inc = ir.connections.filter(function (c) { return c.to === m.id; });
      var out = ir.connections.filter(function (c) { return c.from === m.id; });
      var incS = inc.map(function (c) { return '← ' + c.label + ' (' + M[c.from].label + ')'; }).join(' ');
      var outS = out.map(function (c) { return c.label + ' → ' + M[c.to].label; }).join(' ');
      return [incS, outS].filter(Boolean).join('　') || '—';
    }
    var rows = intl.map(function (m) {
      return '<tr><td class="m">' + esc(m.label) + '</td><td class="d">' + esc(m.description) + '</td><td class="vB-flow">' + esc(flowText(m)) + '</td></tr>';
    }).join('');
    root.innerHTML =
      '<div class="vB">' +
      '<header class="vB-head"><h1 class="vB-title">' + esc(ir.meta.title) + '</h1><p class="vB-sub">' + esc(ir.meta.subtitle) + '</p>' +
      '<dl class="vB-io"><div><dt>输入 Input</dt><dd>' + esc(ioIn) + '</dd></div><div><dt>输出 Output</dt><dd>' + esc(ioOut) + '</dd></div></dl></header>' +
      '<h2>外部依赖 <span>' + ext.length + '</span></h2><div class="vB-ext">' + (extCards || '<div class="vA-empty">无</div>') + '</div>' +
      '<h2>内部模块 <span>' + intl.length + '</span></h2>' +
      '<table class="vB-tbl"><thead><tr><th>模块</th><th>职责</th><th>数据流</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>';
  }

  /* ============ 切换器 ============ */
  var VARIANTS = [
    { key: 'A', name: 'Flow · 数据流图' },
    { key: 'B', name: 'Index · 文档式' }
  ];
  function currentKey() { var m = location.search.match(/variant=([AB])/i); return m ? m[1].toUpperCase() : 'A'; }
  function render() {
    view = null;
    var k = currentKey();
    var root = document.getElementById('root');
    root.innerHTML = '';
    if (k === 'A') renderA(root); else renderB(root);
    var v = VARIANTS.filter(function (x) { return x.key === k; })[0];
    document.getElementById('swlabel').textContent = k + ' — ' + (v ? v.name : '');
  }
  function step(d) {
    var k = currentKey();
    var i = 0;
    VARIANTS.forEach(function (x, idx) { if (x.key === k) i = idx; });
    var n = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key;
    history.replaceState(null, '', '?variant=' + n);
    render();
  }
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  render();
})();
</script>
</body>
</html>
